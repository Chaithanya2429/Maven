name: Java CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
      branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: checkout repository
        uses: actions/checkourt@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          

      - name: Compile Java Program
        run: javac Ch.java

      - name: Run Java Program
        run: java Ch